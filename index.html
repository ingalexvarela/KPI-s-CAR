<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Seguimiento</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --navy:#173b67;
  --blue:#2f75b5;
  --blue2:#8fb7df;
  --light:#e9f2f9;
  --green:#d9ead3;
  --green-strong:#25a18e;
  --orange:#fce4d6;
  --gray:#f4f6f8;
  --border:#d9e1e8;
  --text:#1d2733;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:#eef3f7;
  color:var(--text);
}

.app{
  max-width:1650px;
  margin:0 auto;
  padding:18px;
}

.header{
  background:var(--navy);
  color:#fff;
  border-radius:12px 12px 0 0;
  padding:18px 24px;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:5px 0 0;
  opacity:.88;
  font-size:14px;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  background:#fff;
  border:1px solid var(--border);
  border-top:0;
  padding:13px 18px;
}

.btn{
  background:var(--navy);
  color:#fff;
  border:0;
  border-radius:7px;
  padding:10px 15px;
  font-weight:700;
  cursor:pointer;
}

.status{
  font-size:13px;
  color:#667788;
}

.dashboard{
  background:#fff;
  border:1px solid var(--border);
  border-top:0;
  padding:18px;
  min-height:520px;
}

.profile{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.profile h2{
  margin:0;
  color:var(--navy);
  font-size:25px;
}

.profile-meta{
  display:grid;
  grid-template-columns:repeat(4,minmax(150px,1fr));
  gap:8px;
  width:min(900px,100%);
}

.meta-box{
  background:var(--light);
  padding:9px 11px;
  border-radius:8px;
  font-size:13px;
}

.meta-box b{
  color:var(--navy);
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:17px;
}

.card{
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px 14px;
  background:#fff;
}

.card .label{
  font-size:12px;
  text-transform:uppercase;
  color:#6b7885;
  font-weight:800;
}

.card .value{
  font-size:29px;
  font-weight:800;
  color:var(--navy);
  margin-top:5px;
}

.progress{
  margin-top:8px;
  height:13px;
  background:#e6edf3;
  border-radius:999px;
  overflow:hidden;
}

.progress > div{
  height:100%;
  width:0;
  background:var(--green-strong);
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1150px;
  font-size:13px;
}

thead th{
  background:var(--blue);
  color:#fff;
  padding:9px 7px;
  text-align:center;
}

td{
  padding:6px 7px;
  border-bottom:1px solid #e8edf2;
  vertical-align:middle;
}

th:nth-child(1){width:45px}
th:nth-child(2){width:22%}
th:nth-child(3){width:34%}
th:nth-child(4){width:22%}
th:nth-child(5){width:72px}
th:nth-child(6){width:62px}
th:nth-child(7){width:auto}

.section-row td{
  background:var(--blue2);
  color:#fff;
  font-weight:800;
  text-align:center;
  text-transform:uppercase;
}

.ok{
  background:var(--green);
}

.pending{
  background:var(--orange);
}

.center{
  text-align:center;
}

.bold{
  font-weight:700;
}

.nav-bottom{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:9px;
  background:#fff;
  border:1px solid var(--border);
  border-top:0;
  padding:15px 18px 18px;
  border-radius:0 0 12px 12px;
}

.role-btn{
  border:1px solid #b9c8d6;
  background:#f7fafc;
  color:#294d73;
  border-radius:8px;
  padding:12px 8px;
  font-weight:800;
  cursor:pointer;
}

.role-btn[href]{
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  text-align:center;
}

.role-btn.active{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}

.placeholder{
  padding:80px 20px;
  text-align:center;
  color:#73808b;
}

.error{
  padding:40px 20px;
  text-align:center;
  color:#8a2f2f;
}

@media(max-width:1100px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .profile-meta{
    grid-template-columns:repeat(2,1fr);
  }

  .nav-bottom{
    grid-template-columns:repeat(4,1fr);
  }
}

/* =========== AJUSTE PARA UNA SOLA PANTALLA =========== */
/* El factor final lo calcula JavaScript segun la altura disponible. */
html, body{min-height:100%;}
body{overflow-x:hidden;}
@media (min-width: 1150px){
  .app{max-width:none;}
  table{min-width:0;table-layout:fixed;font-size:12px;}
  td{padding:4px 6px;line-height:1.22;overflow-wrap:break-word;}
  thead th{padding:6px 5px;}
  .section-row td{padding:5px;}
  .nav-bottom{padding:6px 10px;gap:5px;}
  .role-btn{padding:6px 5px;}
}
/* =========== VERSION COMPACTA =========== */
.app{padding:10px;}
.header{padding:11px 16px;}
.header h1{font-size:19px;}
.header p{font-size:12px;margin-top:2px;}
.toolbar{padding:5px 14px;min-height:28px;gap:8px;}
.toolbar .btn{padding:7px 11px;font-size:12px;}
.toolbar.hidden{display:none;}
.status{font-size:11px;}
.dashboard{padding:10px 12px;min-height:380px;}
.profile{gap:8px;margin-bottom:8px;align-items:center;}
.profile h2{font-size:18px;}
.profile-meta{width:min(820px,100%);gap:5px;}
.meta-box{padding:5px 8px;font-size:10px;border-radius:6px;}
.cards{gap:7px;margin-bottom:9px;}
.card{padding:7px 10px;border-radius:8px;min-height:68px;}
.card .label{font-size:9px;}
.card .value{font-size:18px;margin-top:2px;line-height:1.1;}
.progress{height:7px;margin-top:4px;}
.nav-bottom{padding:10px 14px;gap:7px;}
.role-btn{padding:9px 6px;font-size:12px;}
@media(max-width:1100px){
  .profile-meta{width:100%;}
}
@media(max-width:600px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));}
  .profile-meta{grid-template-columns:repeat(2,minmax(0,1fr));}
  .nav-bottom{grid-template-columns:repeat(2,minmax(0,1fr));}
}


/* AJUSTE FINO: metadatos mas legibles y KPI menos altos */
.profile{margin-bottom:5px;gap:7px;}
.profile-meta{width:min(900px,100%);gap:6px;}
.meta-box {
    font-size: 15px;
    padding: 5px 9px;
    line-height: 1.15;
    white-space: nowrap;
}

.meta-box b {
    font-size: 15px;
    font-weight: 800;
}
.cards{gap:7px;margin-bottom:6px;}
.card{padding:5px 9px;min-height:49px;}
.card .label{font-size:9px;line-height:1.15;}
.card .value{font-size:18px;line-height:1.05;margin-top:1px;}
.progress{height:5px;margin-top:3px;}
@media(max-width:1100px){.meta-box{white-space:normal;}}

/* Identidad visual de la operacion electrica: sin aumentar alto del encabezado */
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:62px;}
.header-copy{min-width:0;}
.electric-brand{display:flex;align-items:center;gap:9px;flex-shrink:0;color:#fff;opacity:.94;}
.electric-brand span{display:flex;flex-direction:column;gap:2px;letter-spacing:.09em;}
.electric-brand strong{font-size:11px;line-height:1.1;}
.electric-brand small{font-size:9px;line-height:1.15;color:#cde8f7;letter-spacing:.06em;}
@media(max-width:760px){.electric-brand{display:none;}}
/* Evitar espacio innecesario al final y limitar el ajuste al alto util */
.app{padding:6px 8px;}
.dashboard{min-height:0;}
.nav-bottom{padding:5px 9px;}
.profile{margin-bottom:4px;}
.cards{margin-bottom:4px;}


/* Imagen del coordinador y espacio dinamico de la tabla */
.header-right{display:flex;align-items:center;gap:16px;min-width:0;}
.foto-coordinador{width:190px;height:85px;object-fit:cover;border-radius:7px;border:1px solid rgba(255,255,255,.45);}
.foto-coordinador[hidden]{display:none!important;}
.header:has(.foto-coordinador:not([hidden])){min-height:76px;padding-top:7px;padding-bottom:7px;}
@media(max-width:850px){.foto-coordinador{width:90px;height:43px;}.header-right{gap:5px;}}
@media (min-width:1150px){
  /* Altura flexible calculada segun el espacio vertical util */
  table tbody tr:not(.section-row) td{padding-top:calc(4px + var(--extra-fila, 0px));padding-bottom:calc(4px + var(--extra-fila, 0px));}
  table tbody tr.section-row td{padding-top:calc(5px + var(--extra-seccion, 0px));padding-bottom:calc(5px + var(--extra-seccion, 0px));}
}


/* ==========================================================
   LEGIBILIDAD AMPLIADA PARA NAVEGADOR AL 100 %
   Ajuste independiente del zoom de Edge/Chrome.
   Cambiar ESCALA_VISUAL en JavaScript para personalizar.
   ========================================================== */
:root{--escala-visual:1.20;}
@media(min-width:1150px){
  table{font-size:calc(12px * var(--escala-visual));}
  td{line-height:1.16;padding-left:6px;padding-right:6px;}
  thead th{font-size:calc(11px * var(--escala-visual));padding:5px 4px;line-height:1.14;}
  table tbody tr:not(.section-row) td{
    padding-top:calc(2px + var(--extra-fila, 0px));
    padding-bottom:calc(2px + var(--extra-fila, 0px));
  }
  table tbody tr.section-row td{
    padding-top:calc(3px + var(--extra-seccion, 0px));
    padding-bottom:calc(3px + var(--extra-seccion, 0px));
  }
  .role-btn{font-size:calc(12px * var(--escala-visual));padding:7px 5px;}
  .profile h2{font-size:calc(18px * var(--escala-visual));}
  .meta-box,.meta-box b{font-size:calc(10px * var(--escala-visual));}
  .card .label{font-size:calc(9px * var(--escala-visual));}
  .card .value{font-size:calc(18px * var(--escala-visual));}
  .header h1{font-size:calc(19px * var(--escala-visual));}
  .header p{font-size:calc(11px * var(--escala-visual));}
}


/* =====================================================
   AJUSTE VISUAL: imagen derecha / titulo centrado / KPI compacto
   ===================================================== */
.header-right{
  margin-left:auto;
  justify-content:flex-end;
}
.electric-brand{order:1;}
#fotoCoordinador.foto-coordinador{
  order:2;
  margin-left:5px;
}

/* Centrar el puesto en el espacio libre a la izquierda de los datos */
.profile{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:10px;
  margin-bottom:4px;
}
.profile-title{
  flex:1 1 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:135px;
}
.profile-title h2{
  margin:0;
  text-align:center;
  font-size:20px;
}
.profile-meta{
  flex:0 1 54%;
  width:auto;
  min-width:0;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:5px;
}
.meta-box{
  padding:5px 7px;
  font-size:11px;
  line-height:1.15;
}
.meta-box b{font-size:11px;}

/* Reducir altura, pero conservar letras legibles */
.cards{
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
  margin-bottom:4px;
}
.card{
  min-height:42px;
  padding:4px 9px;
  border-radius:7px;
}
.card .label{font-size:10px;line-height:1.1;}
.card .value{font-size:19px;line-height:1.05;margin-top:1px;}
.progress{height:4px;margin-top:3px;}

/* Estos estilos prevalecen sobre la escala visual anterior */
@media(min-width:1150px){
  .profile-title h2{font-size:21px;}
  .card .label{font-size:10px;}
  .card .value{font-size:19px;}
}
@media(max-width:1100px){
  .profile{flex-wrap:wrap;}
  .profile-title{justify-content:flex-start;min-width:100%;}
  .profile-meta{flex:1 1 100%;width:100%;}
}
@media(max-width:600px){
  .profile-meta{grid-template-columns:repeat(2,minmax(0,1fr));}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));}
}


/* === DISTRIBUCION VERTICAL SEGUN REFERENCIA VISUAL === */
.summary-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  align-items:stretch;
  gap:8px;
  margin-bottom:5px;
}
.summary-layout.has-photo{grid-template-columns:156px minmax(0,1fr);}
.portrait-slot{display:none;}
.has-photo .portrait-slot{display:flex;align-items:center;justify-content:center;}
.summary-layout .foto-coordinador{
  display:block;
  width:150px;
  height:61px;
  object-fit:cover;
  border:2px solid #b9c8d6;
  border-radius:5px;
  margin:0 !important;
}
.summary-content{min-width:0;display:flex;flex-direction:column;justify-content:space-between;}
.summary-content .profile{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;margin:0 0 3px !important;}
.summary-content .profile-title{flex:0 0 180px;min-width:0;justify-content:flex-start;}
.summary-content .profile-title h2{text-align:left;font-size:19px;}
.summary-content .profile-meta{flex:1 1 auto;width:auto;max-width:850px;justify-self:end;gap:5px;}
.summary-content .meta-box{padding:4px 6px;font-size:10px;line-height:1.05;}
.summary-content .meta-box b{font-size:10px;}
.summary-content .cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:0 !important;}
.summary-content .card{padding:3px 7px;min-height:37px;border-radius:6px;}
.summary-content .card .label{font-size:9px;line-height:1.05;}
.summary-content .card .value{font-size:18px;line-height:1.0;margin-top:1px;}
.summary-content .progress{height:4px;margin-top:2px;}
.header .foto-coordinador{display:none !important;}
.header:has(.foto-coordinador:not([hidden])){min-height:62px;padding:11px 16px;}
@media(max-width:1050px){
  .summary-layout.has-photo{grid-template-columns:120px minmax(0,1fr);}
  .summary-layout .foto-coordinador{width:116px;height:61px;}
  .summary-content .profile-title{flex-basis:130px;}
  .summary-content .profile-meta{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:680px){
  .summary-layout.has-photo{grid-template-columns:1fr;}
  .has-photo .portrait-slot{justify-content:flex-start;}
  .summary-content .profile{flex-wrap:wrap;}
  .summary-content .profile-title{flex:1 1 100%;}
  .summary-content .profile-meta{flex:1 1 100%;}
  .summary-content .cards{grid-template-columns:repeat(2,minmax(0,1fr));}
}


/* Correccion definitiva de imagen y legibilidad de tarjetas KPI */
.header #fotoCoordinador{display:none!important;}
.summary-layout.has-photo .portrait-slot{display:flex;}
.summary-layout .foto-coordinador{display:block;width:150px;height:64px;object-fit:cover;}
#fotoCoordinadorPerfil[hidden]{display:none!important;}
.summary-content .card{min-height:43px;padding:4px 8px;}
.summary-content .card .label{font-size:12px!important;line-height:1.1!important;}
.summary-content .card .value{font-size:23px!important;line-height:1.05!important;margin-top:1px;}
.summary-content .progress{height:5px;margin-top:2px;}
@media(max-width:1050px){.summary-layout .foto-coordinador{width:116px;height:64px;}}


/* ===============================================================
   CONTROLES REALES DEL PERFIL (ultima regla para evitar conflictos)
   Cambiar estas cuatro variables para personalizar.
   =============================================================== */
:root{
  --foto-perfil-ancho: 185px;
  --foto-perfil-alto: 78px;
  --texto-datos-perfil: 14px;
  --texto-etiquetas-perfil: 14px;
}
.summary-layout.has-photo {
  grid-template-columns: calc(var(--foto-perfil-ancho) + 8px) minmax(0,1fr) !important;
}
.summary-layout.has-photo .portrait-slot {
  display:flex !important;
  align-items:center;
  justify-content:center;
}
.summary-layout.has-photo #fotoCoordinadorPerfil {
  display:block !important;
  width:var(--foto-perfil-ancho) !important;
  height:var(--foto-perfil-alto) !important;
  max-width:none !important;
  object-fit:cover;
}
.summary-layout.has-photo #fotoCoordinadorPerfil[hidden] {
  display:none !important;
}
.summary-content .profile-meta .meta-box {
  font-size:var(--texto-datos-perfil) !important;
  line-height:1.18 !important;
  padding:5px 7px !important;
  white-space:nowrap;
}
.summary-content .profile-meta .meta-box b {
  font-size:var(--texto-etiquetas-perfil) !important;
  font-weight:800 !important;
}
@media(max-width:1050px){
  .summary-layout.has-photo{
    grid-template-columns: calc(var(--foto-perfil-ancho) + 8px) minmax(0,1fr) !important;
  }
}
@media(max-width:680px){
  .summary-layout.has-photo{grid-template-columns:1fr !important;}
  .summary-content .profile-meta .meta-box{white-space:normal;}
}


/* Puesto en una sola linea, sin alterar la tabla ni las tarjetas */
@media (min-width:1101px){
  .summary-content .profile-title{
    flex:0 0 255px !important;
    min-width:255px !important;
    justify-content:flex-start !important;
  }
  .summary-content .profile-title h2{
    white-space:nowrap !important;
    font-size:19px !important;
    line-height:1.1 !important;
  }
  .summary-content .profile-meta{
    flex:1 1 0 !important;
    min-width:0 !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="header-copy">
      <h1>DASHBOARD DE SEGUIMIENTO DE FUNCIONES</h1>
      <p>Ingeniería Eléctrica · Seguimiento mensual por puesto</p>

  const foto = document.getElementById("fotoCoordinadorPerfil");
  if(!foto || !original) return;
  const mostrar = currentRole === "coordinador" || currentRole === "analista";
  foto.hidden = !mostrar;
  if(mostrar){
    const imagen = currentRole === "analista" ? IMAGEN_ANALISTA : original.getAttribute("src");
    if(foto.getAttribute("src") !== imagen) foto.setAttribute("src", imagen);
    foto.alt = currentRole === "analista" ? "Ilustración del Analista de Red y DER" : "Coordinador de Cuadrillas";
  }
}

function ajustarDashboardAPantalla(){
  actualizarFotoCoordinador();
  const doc = document.documentElement;
  appContainer.style.zoom = "1";
  doc.style.setProperty("--extra-fila", "0px");
  doc.style.setProperty("--extra-seccion", "0px");
  document.body.style.overflowY = "auto";
  if(!AJUSTAR_A_PANTALLA) return;

  // Medir el contenido sin ampliar el ancho. El zoom del navegador permanece en 100%.
  const anchoDisponible = doc.clientWidth - MARGEN_PANTALLA;
  const altoDisponible = window.innerHeight - MARGEN_PANTALLA;
  const altoNatural = appContainer.getBoundingClientRect().height;
  const anchoNatural = Math.max(appContainer.scrollWidth, appContainer.offsetWidth);
  const escala = Math.max(ESCALA_MINIMA, Math.min(
    1,
    anchoDisponible / Math.max(1, anchoNatural),
    altoDisponible / Math.max(1, altoNatural)
  ));
  appContainer.style.zoom = String(escala);

  // Repartir la altura restante entre las filas de la tabla, incluso cuando
  // fue necesario aplicar escala. Así no queda una franja vacía bajo los botones.
  if(window.innerWidth >= 1150){
    const tbody = dashboard.querySelector("tbody");
    if(tbody){
      const filas = tbody.querySelectorAll("tr:not(.section-row)").length;
      const secciones = tbody.querySelectorAll("tr.section-row").length;
      const altoActual = appContainer.getBoundingClientRect().height;
      const espacioLibre = Math.max(0, altoDisponible - altoActual - 4);
      const unidades = Math.max(1, 2 * filas + 1.1 * secciones);
      // Los valores de padding se establecen en píxeles CSS (antes del zoom).
      const extraFila = Math.max(0, espacioLibre / Math.max(escala, 0.01) / unidades);
      doc.style.setProperty("--extra-fila", extraFila.toFixed(2) + "px");
      doc.style.setProperty("--extra-seccion", (extraFila * 0.55).toFixed(2) + "px");
    }
  }

  // Solo habilitar desplazamiento si la pantalla es demasiado pequeña.
  const altoFinal = appContainer.getBoundingClientRect().bottom;
  document.body.style.overflowY = altoFinal <= window.innerHeight + 1 ? "hidden" : "auto";
}

function solicitarAjuste(){
  if(ajustePendiente) return;
  ajustePendiente = true;
  requestAnimationFrame(() => {
    ajustePendiente = false;
    ajustarDashboardAPantalla();
  });
}
window.addEventListener("resize", solicitarAjuste);
new MutationObserver(solicitarAjuste).observe(dashboard, {childList:true, subtree:true});
solicitarAjuste();

/* =====================================================
   CARGAR EXCEL AUTOMÁTICAMENTE DESDE GITHUB
   ===================================================== */

async function loadRemoteExcel(url, roleName){

  try{

    dashboard.innerHTML = `
      <div class="placeholder">
        Cargando datos de ${roleName}...
      </div>
    `;

    status.textContent =
      `Leyendo ${url} ...`;

    /*
      Evita que el navegador mantenga en caché
      el Excel anterior.
    */

    const response = await fetch(
      url + "?v=" + Date.now()
    );

    if(!response.ok){

      throw new Error(
        "No se pudo encontrar el archivo."
      );

    }

    const arrayBuffer =
      await response.arrayBuffer();

    const workbook = XLSX.read(
      arrayBuffer,
      {
        type:"array",
        cellDates:true
      }
    );

    processWorkbook(
      workbook,
      roleName,
      url
    );

  }catch(error){

    console.error(error);

    dashboard.innerHTML = `
      <div class="error">

        <h3>No se pudo cargar el Excel</h3>

        <p>
          Archivo esperado:
          <b>${url}</b>
        </p>

        <p>
          Verifique que el archivo exista
          en el repositorio de GitHub.
        </p>

      </div>
    `;

    status.textContent =
      "No se pudo cargar el archivo automáticamente.";
  }

}

input.addEventListener(
  "change",

    }

/* =====================================================
   PROCESAR LIBRO
   ===================================================== */

function processWorkbook(
  workbook,
  roleName,
  sourceName
){

  const sheetName =
    workbook.SheetNames.find(
      name =>
        normalize(name) === "SEGUIMIENTO"
    );

  if(!sheetName){

    dashboard.innerHTML = `
      <div class="error">

        No se encontró una hoja llamada
        <b>Seguimiento</b>.

      </div>
    `;

    status.textContent =
      "El Excel no contiene la hoja Seguimiento.";

    return;

  }

  const worksheet =
    workbook.Sheets[sheetName];

  const rows =
    XLSX.utils.sheet_to_json(
      worksheet,
      {
        header:1,
        raw:true,
        defval:""
      }
    );

  const data =
    parseSeguimiento(rows);

  renderDashboard(
    data,
    roleName,
    sourceName
  );

}


/* =====================================================
   LEER HOJA SEGUIMIENTO
   ===================================================== */

function parseSeguimiento(rows){

  const data = {

    mes:
      monthName(
        rows[2]?.[1]
      ),

    fecha:
      formatDate(
        rows[3]?.[1]
      ),

    responsable:
      rows[2]?.[4] || "",

    jefatura:
      rows[3]?.[4] || "",

    items:[]
  };


  let section = "";


  for(
    let r = 5;
    r < rows.length;
    r++
  ){

    const row = rows[r];

    const first = row?.[0];


    /*
      termina al llegar
      al resumen mensual
    */

    if(
      normalize(first) ===
      "CUMPLIMIENTO GENERAL MENSUAL"
    ){

      break;

    }


    /*
      Detectar encabezados
      de sección
    */

    if(
      typeof first === "string" &&
      first &&
      !/^\d+$/.test(first.trim())
    ){

      section = first.trim();

      continue;

    }


    /*
      Filas numeradas
    */

    if(
      typeof first === "number" ||
      /^\d+$/.test(String(first))
    ){

      data.items.push({

        n:first,

        aspecto:
          row[1] || "",

        indicador:
          row[2] || "",

        meta:
          row[3] || "",

        cumplido:
          checked(row[4]),

        na:
          checked(row[5]),

        obs:
          row[6] || "",

        section

      });

    }

  }


  return data;

}


/* =====================================================
   CALCULAR Y MOSTRAR DASHBOARD
   ===================================================== */

function renderDashboard(
  data,
  roleName,
  sourceName
){

  const aplica =
    data.items.filter(
      x => !x.na
    );


  const cumplidas =
    aplica.filter(
      x => x.cumplido
    ).length;


  const pendientes =
    aplica.filter(
      x => !x.cumplido
    ).length;


  const na =
    data.items.filter(
      x => x.na
    ).length;


  const total =
    data.items.length;


  const pct =
    aplica.length
      ? Math.round(
          cumplidas /
          aplica.length *

      : 0;


  let rowsHtml = "";

      rowsHtml += `

          <td colspan="7">

    rowsHtml += `

          : "pending"

        <td class="center bold">
          ${item.n}
        </td>

        <td class="bold">
          ${escapeHtml(item.aspecto)}
        </td>

        <td>
          ${escapeHtml(item.indicador)}
        </td>

        <td>
          ${escapeHtml(item.meta)}
        </td>

        <td class="center">
          ${
            item.cumplido
              ? "☑"
              : "☐"
          }
        </td>

        <td class="center">
          ${
            item.na
              ? "☑"
              : "☐"
          }
        </td>

        <td>
          ${escapeHtml(item.obs)}
        </td>

      </tr>

    `;

  }


  dashboard.innerHTML = `

    <div class="summary-layout ${(currentRole === "coordinador" || currentRole === "analista") ? "has-photo" : ""}">
      <div id="portraitSlot" class="portrait-slot"><img id="fotoCoordinadorPerfil" class="foto-coordinador" alt="Coordinador de Cuadrillas" hidden></div>
      <div class="summary-content">
    <div class="profile">

      <div class="profile-title">

        <h2>
          ${roleName}
        </h2>

      </div>


      <div class="profile-meta">

        <div class="meta-box">

          <b>Mes:</b>

          ${escapeHtml(data.mes)}

        </div>


        <div class="meta-box">

          <b>Fecha:</b>

          ${escapeHtml(data.fecha)}

        </div>


        <div class="meta-box">

          <b>Responsable:</b>

          ${escapeHtml(
            data.responsable
          )}

        </div>


        <div class="meta-box">

          <b>Jefatura:</b>

          ${escapeHtml(
            data.jefatura
          )}

        </div>

      </div>

    </div>


    <div class="cards">

      <div class="card">

        <div class="label">
          Total funciones
        </div>

        <div class="value">
          ${total}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Cumplidas
        </div>

        <div class="value">
          ${cumplidas}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Pendientes
        </div>

        <div class="value">
          ${pendientes}
        </div>

      </div>


      <div class="card">

        <div class="label">
          No aplica
        </div>

        <div class="value">
          ${na}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Cumplimiento
        </div>

        <div class="value">
          ${pct}%
        </div>

        <div class="progress">

          <div
            style="
            width:${pct}%
            "
          ></div>

        </div>

      </div>

    </div>
      </div>
    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>N.°</th>

            <th>
              Aspecto de seguimiento
            </th>

            <th>
              Indicador / criterio mensual
            </th>

            <th>
              Meta
            </th>

            <th>
              Cumplido
            </th>

            <th>
              N/A
            </th>

            <th>
              Observaciones / pendientes
            </th>

          </tr>

        </thead>


        <tbody>

          ${rowsHtml}

        </tbody>

      </table>

    </div>

  `;

  // Reubicar y mostrar la imagen una vez creado el nuevo encabezado del puesto.
  actualizarFotoCoordinador();

}


/* =====================================================
   FUNCIONES AUXILIARES
   ===================================================== */

function normalize(value){

  return String(
    value ?? ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .toUpperCase()
  .trim();

}


function checked(value){

  if(
    value === true ||
    value === 1
  ){

    return true;

  }


  const text =
    normalize(value);


  return [

    "TRUE",
    "VERDADERO",
    "SI",
    "SÍ",
    "X",
    "1",
    "OK",
    "CUMPLIDO",
    "☑",
    "✓",
    "✔"

  ].includes(text);

}


function formatDate(value){

  if(
    value instanceof Date &&
    !isNaN(value)
  ){

    return new Intl.DateTimeFormat(
      "es-CR",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    ).format(value);

  }


  if(
    typeof value === "number"
  ){

    const d =
      XLSX.SSF.parse_date_code(
        value
      );


    if(d){

      return (
        String(d.d).padStart(2,"0")
        + "/"
        + String(d.m).padStart(2,"0")
        + "/"
        + d.y
      );

    }

  }


  return String(
    value || ""
  );

}


function monthName(value){

  let date = value;


  if(
    typeof value === "number"
  ){

    const d =
      XLSX.SSF.parse_date_code(
        value
      );


    if(d){

      date =
        new Date(
          d.y,
          d.m - 1,
          d.d
        );

    }

  }


  if(
    date instanceof Date &&
    !isNaN(date)
  ){

    return new Intl.DateTimeFormat(
      "es-CR",
      {
        month:"long",
        year:"numeric"
      }
    ).format(date);

  }


  return String(
    value || ""
  );

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}
